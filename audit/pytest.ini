[pytest]
asyncio_mode = auto
timeout = 120
markers =
    integrity:   Document integrity and extraction audits
    security:    Security, isolation, injection, authorization audits
    performance: Latency, throughput, memory audits
    reliability: Recovery, idempotency, chaos audits
    retrieval:   Retrieval quality, hallucination, attribution audits
    regression:  Fixed benchmark regression audits
    chaos:       Chaos engineering audits (slow, stateful)
    decision:    Multi-step decision intelligence audits
log_cli = true
log_cli_level = INFO
