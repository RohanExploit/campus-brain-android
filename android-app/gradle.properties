org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# NOTE: org.gradle.java.home does NOT belong in this file.
#
# It used to pin an absolute Windows path here -- one developer's Adoptium
# install -- because AGP 9 does not run on the Java 23 that machine has on
# PATH. That is a real constraint, but this file is committed, so every CI
# runner inherited a path that cannot exist on Linux and failed before
# compiling anything: "Java home supplied is invalid".
#
# Machine-specific toolchain config goes in the user's own Gradle home
# (~/.gradle/gradle.properties or %USERPROFILE%\.gradle\gradle.properties),
# which is not committed and overrides nothing for anyone else:
#
#     org.gradle.java.home=C:/Program Files/Eclipse Adoptium/jdk-21...
#
# On a runner, actions/setup-java sets JAVA_HOME and Gradle follows it.

android.useAndroidX=true
android.nonTransitiveRClass=true
