org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# AGP 9 does not run on Java 23. A previous version of this file pinned
# org.gradle.java.home to one contributor's absolute Windows JDK path, which
# broke the build on every other machine, including CI (Gradle rejects a
# org.gradle.java.home that does not exist rather than falling back). A
# machine-specific JDK belongs in that machine's own
# GRADLE_USER_HOME/gradle.properties (or its JAVA_HOME), never here -- CI
# already selects JDK 17 via actions/setup-java.
android.useAndroidX=true
android.nonTransitiveRClass=true
