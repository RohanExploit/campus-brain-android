# AGP 9 does not run on Java 23, which is what this machine has on PATH.
# Pinned here rather than by changing JAVA_HOME, so other tooling that expects
# Java 23 keeps working. Forward slashes: Gradle accepts them on Windows and
# they avoid the backslash-escaping rules of .properties files.
