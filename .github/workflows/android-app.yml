name: Campus Brain (Android)

# The native Kotlin app in android-app/.
#
# android.yml targets an older Flutter tree under mobile/ and is path-filtered
# to it, so it never fires for this app. This workflow is the one that actually
# builds what ships.
#
# It exists so a green build does not depend on one laptop being awake: every
# push runs the full JVM suite and produces an installable APK as an artifact,
# downloadable from the run page on any machine.

on:
  push:
    paths:
      - 'android-app/**'
      - '.github/workflows/android-app.yml'
  pull_request:
    paths:
      - 'android-app/**'
  workflow_dispatch:

concurrency:
  # A newer push makes an in-flight run obsolete. Cancel it rather than paying
  # for two builds and reading the older one's result by mistake.
  group: android-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unit tests and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android-app

    steps:
      - uses: actions/checkout@v4

      # 17 because app/build.gradle.kts pins source/targetCompatibility to 17.
      # The dev machine has 21 and 23 installed; pinning here stops the runner
      # drifting onto whatever the image ships this month.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      # local.properties on the dev machine points at R:/toolchains/android-sdk
      # and is not committed. The runner's SDK location comes from ANDROID_HOME,
      # which setup-android/the image provides, so nothing is written here.
      # The ONNX embedder is gitignored: it is 86MB and regenerable, so it would
      # bloat every clone forever. Without it the JVM battery still runs, but the
      # vector arm is absent and it silently degrades to keyword-only -- a green
      # CI that verified noticeably less than it appears to. Pulling it from the
      # release makes the runner exercise the same fused pipeline a phone does.
      #
      # Non-fatal on purpose: a release that is missing or renamed should show up
      # as reduced coverage in the log, not as a red build on unrelated work. The
      # battery's regression floors already skip themselves when vectors are
      # absent, so nothing silently passes a weaker bar.
      - name: Fetch the ONNX embedder for full-fidelity tests
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p app/src/main/assets/minilm
          gh release download assets-v1 --repo "$GITHUB_REPOSITORY"             --pattern model.onnx --pattern vocab.txt --dir app/src/main/assets/minilm --clobber
          ls -la app/src/main/assets/minilm/

      # Said out loud, before the suite runs, because the previous behaviour was
      # that a failed download produced NOTHING: the batteries skipped their
      # floors, the build went green, and the log never mentioned that the vector
      # arm had not been exercised. The fetch above stays non-fatal -- see its
      # comment -- so this step reports and never fails.
      #
      # It is an ASSET check, which is a proxy and is labelled as one. The
      # battery's own gate is JvmCorpus.vectorArm, which is true only when the
      # model actually LOADED; JvmCorpus.modelAssetPresent exists precisely to
      # tell "no model on this machine" apart from "the model would not load".
      # The authoritative per-run statement is the "JvmCorpus ready:" line the
      # harness prints, read back out of the results below.
      - name: Retrieval coverage (asset check)
        shell: bash
        run: |
          model=app/src/main/assets/minilm/model.onnx
          vocab=app/src/main/assets/minilm/vocab.txt
          if [ -s "$model" ] && [ -s "$vocab" ]; then
            size=$(du -h "$model" | cut -f1)
            echo "::notice title=Retrieval coverage::ONNX embedder assets present (model=$size, vocab present). The JVM batteries should run fts5+vector and enforce their regression floors."
            {
              echo "### Retrieval coverage"
              echo
              echo "- ONNX embedder assets: **present** (model=$size, vocab present)"
              echo "- Expected arms: **fts5 + vector**"
              echo "- Battery regression floors: **expected to be enforced**"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning title=Retrieval coverage REDUCED::ONNX embedder assets INCOMPLETE. The JVM batteries will run KEYWORD-ONLY and will SKIP their regression floors. A green build here verified less than it appears to."
            {
              echo "### Retrieval coverage -- REDUCED"
              echo
              echo "- ONNX embedder assets: **incomplete** (need both \`model.onnx\` and \`vocab.txt\` from \`assets-v1\`)"
              echo "- Expected arms: **KEYWORD-ONLY**"
              echo "- Battery regression floors: **skipped** -- \`JvmAdversarialBatteryTest\` and"
              echo "  \`JvmHardQueryBatteryTest\` guard their assertions with \`if (JvmCorpus.vectorArm)\`."
              echo "- **A green build on this run is not evidence about retrieval quality.**"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain --no-daemon

      # What the batteries ACTUALLY did, as opposed to what the asset check
      # predicted. JvmCorpus prints one line per JVM naming every arm it wired
      # up; Gradle captures test stdout into the JUnit XML, so it can be read
      # back here without changing the build script or the test sources.
      #
      # if: always() because a failing suite is exactly when this matters -- a
      # floor assertion that did not run is not a floor that passed. Ends with
      # `true` so a missing report can never turn a green suite red.
      - name: Report which retrieval arms the batteries used
        if: always()
        shell: bash
        run: |
          # EVERY match, not the first. Gradle may fork more than one test JVM,
          # and JvmCorpus is built once per JVM, so there can be several of these
          # lines -- and a run where one fork loaded the model and another did not
          # is itself the finding. Taking `head -1` of a recursive walk would
          # report whichever fork the walk reached first.
          #
          # -I matters: Gradle keeps a binary event log beside the XML, and
          # grep -o on it prints "Binary file ... matches", which contains no
          # "vectors=" and would be misread as keyword-only. Only the XML is
          # read; the HTML report escapes differently and adds nothing.
          # The sed trims a CDATA terminator: Gradle normally entity-escapes
          # system-out, but wraps it in CDATA when the output contains markup,
          # and "[^<]*" cannot see the end of a CDATA block.
          lines=$(grep -rhoI --include='*.xml' 'JvmCorpus ready:[^<]*' \
                    app/build/test-results/testDebugUnitTest 2>/dev/null \
                    | sed 's/]]>.*$//' | sort -u || true)
          if [ -z "$lines" ]; then
            echo "::warning title=Battery harness did not report::No 'JvmCorpus ready:' line in the test results. The JVM batteries may not have run at all."
            echo "- Battery harness: **no \`JvmCorpus ready:\` line found** -- the batteries may not have run." >> "$GITHUB_STEP_SUMMARY"
          elif [ -z "$(printf '%s\n' "$lines" | grep -v 'vectors=true' || true)" ]; then
            echo "::notice title=Batteries ran with the vector arm::$lines"
            echo "- Batteries actually ran: **fts5 + vector**" >> "$GITHUB_STEP_SUMMARY"
            printf '%s\n' "$lines" | sed 's/^/      /' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning title=Batteries ran KEYWORD-ONLY::$lines"
            {
              echo "- Batteries actually ran: **KEYWORD-ONLY** (at least one test JVM had no embedder)"
              echo "- The regression floors were **skipped**. Do not quote this run as a retrieval result."
            } >> "$GITHUB_STEP_SUMMARY"
            printf '%s\n' "$lines" | sed 's/^/      /' >> "$GITHUB_STEP_SUMMARY"
          fi
          true

      # Always upload: a failing run is exactly when the per-test XML is worth
      # reading, and the summary line alone does not say which case broke.
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: android-app/app/build/reports/tests/testDebugUnitTest
          retention-days: 14
          if-no-files-found: warn

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --console=plain --no-daemon

      # The point of the whole workflow: an installable build that outlives the
      # machine that pushed it. Debug-signed, so it installs over a debug build
      # already on a device without an uninstall.
      - uses: actions/upload-artifact@v4
        with:
          name: campus-brain-debug-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error

      # Lint last: it must not stop the APK being produced. A build that fails
      # only on a lint warning still yields something demonstrable.
      - name: Lint
        continue-on-error: true
        run: ./gradlew :app:lintDebug --console=plain --no-daemon

      - name: Upload lint report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: android-app/app/build/reports/lint-results-debug.html
          retention-days: 14
          if-no-files-found: ignore
