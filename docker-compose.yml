version: '3.8'

services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000

  telegram_bot:
    build: .
    depends_on:
      - api
    env_file:
      - .env
    command: python bots/telegram_bot.py

  whatsapp_bot:
    build: .
    ports:
      - "8001:8001"
    depends_on:
      - api
    env_file:
      - .env
    command: uvicorn bots.whatsapp_bot:app --host 0.0.0.0 --port 8001

  scheduler:
    build: .
    depends_on:
      - api
    volumes:
      - ./data:/app/data
    command: python scheduler/weekly_ingest.py
