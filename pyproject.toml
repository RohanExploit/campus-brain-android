[project]
name = "company-brain"
version = "0.1.0"
description = "Company Brain — multi-tenant document intelligence (retrieval + graph + tabular) over exam-result corpora."
requires-python = ">=3.12"

# Direct dependencies, exact-pinned to the versions validated on Python 3.12
# (.venv312, full suite green: 173 passed / 1 skipped). uv.lock pins the full
# transitive tree; this list is the source of truth for direct deps.
dependencies = [
    # Core API / server
    "fastapi==0.141.1",
    "uvicorn==0.52.0",
    "pydantic==2.13.4",
    "python-multipart==0.0.32",
    "starlette==1.3.1",
    # Bots
    "python-telegram-bot==22.8",
    "httpx==0.28.1",
    # Config / secrets
    "python-dotenv==1.2.2",
    "cryptography==50.0.0",
    # LLM clients
    "openai==2.53.0",
    "ollama==0.6.2",
    # Ingestion pipeline
    "docling==2.117.0",
    "langchain-text-splitters==1.1.2",
    "sentence-transformers==5.6.1",
    "faiss-cpu==1.14.3",
    "networkx==3.4.2",
    "requests==2.34.2",
    # Tabular / SQL engine
    "duckdb==1.5.5",
    "pdfplumber==0.11.10",
    "rapidfuzz==3.14.5",
    # Scheduler
    "APScheduler==3.11.3",
    # Numerics
    "numpy==2.2.6",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.2",
]

# Application project (not a distributable library): don't build/install it.
[tool.uv]
package = false
